# Drives the agent's page production on an hourly beat.
#
# Vercel's own cron fires once a day (vercel.json), which is right for
# production cadences but too slow for testing and for the "continuous"
# cadence. GitHub's scheduler is free, runs regardless of anyone's laptop
# or session, and this repo is already the deployment source of truth.
#
# Requires one repository secret: CRON_SECRET, matching the Vercel env var
# of the same name (Settings → Secrets and variables → Actions).
#
# The engine still decides whether any site is actually due — firing this
# more often than sites are due is a cheap no-op (sitesDue: 0).
name: Agent cycle
on:
  schedule:
    # Twice an hour, mid-hour. GitHub silently drops scheduled runs when
    # its queue is busy, and the top-of-hour window is the busiest — on
    # ":10" this workflow fired 39 to 107 minutes late and then missed
    # three consecutive hours outright. Two off-peak attempts per hour
    # means one dropped slot no longer costs a whole cycle, and firing
    # when nothing is due is a no-op the engine answers with sitesDue: 0.
    - cron: "23,53 * * * *"
  workflow_dispatch: {}
  # Fire-by-push: the session's GitHub integration cannot call the
  # workflow-dispatch API (403), but it can push. Touching the marker file
  # below runs the cycle immediately, so "generate a page" is one commit.
  push:
    paths:
      - ".github/agent-cycle-trigger"

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger the agent cycle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set"; exit 1
          fi
          # Tolerate a value saved as "Bearer <secret>" — the first run
          # failed with a doubled "Bearer Bearer" header for exactly that.
          SECRET="${CRON_SECRET#Bearer }"
          response=$(curl -sS -m 330 -w "\nHTTP_STATUS:%{http_code}" \
            -H "Authorization: Bearer ${SECRET}" \
            https://leadsmart-saas-up.vercel.app/api/cron/run)
          echo "$response"
          status=$(echo "$response" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          if [ "$status" = "401" ]; then
            echo "::error::401 unauthorized - the CRON_SECRET repository secret does not match Vercel's CRON_SECRET env var"; exit 1
          fi
          echo "$response" | grep -q '"ok": *true' || { echo "::error::cycle failed (HTTP $status)"; exit 1; }
